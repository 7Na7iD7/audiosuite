name: audiosuite
description: Cross-platform audio toolkit with a Rust DSP core.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1

  flutter_rust_bridge: 2.11.1
  rust_lib_audiosuite:
    path: rust_builder

  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  record: ^6.0.0

  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21